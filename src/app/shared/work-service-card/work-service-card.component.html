<article
  class="work-service-card"
  [class.work-service-card--web]="card.variant === 'web'"
  [class.work-service-card--music]="card.variant === 'music'"
  [class.work-service-card--art]="card.variant === 'art'"
>
  <span
    class="work-card-surface"
    [style.background]="card.surfaceBackground ?? null"
    aria-hidden="true"
  ></span>

  <div class="work-card-content" [class.work-card-content--dark]="card.dark">
    <div class="work-card-meta">
      <span>{{ card.index }}</span>
      <span>{{ card.category }}</span>
    </div>

    @switch (card.icon) {
      @case ('web') {
        <svg class="work-card-icon" viewBox="0 0 160 112" aria-hidden="true" focusable="false">
          <rect x="13" y="16" width="134" height="80" rx="2"></rect>
          <path d="M13 34h134M25 25h3M35 25h3M45 25h3M29 49h42v31H29zM82 49h47M82 61h38M82 73h28"></path>
        </svg>
      }
      @case ('music') {
        <svg class="work-card-icon" viewBox="0 0 160 112" aria-hidden="true" focusable="false">
          <path d="M22 74V53M34 82V43M46 70V56M58 90V34M70 76V49M82 85V40M94 69V57M106 91V31M118 76V49M130 83V42M142 72V54"></path>
          <circle cx="58" cy="34" r="3"></circle>
          <circle cx="106" cy="31" r="3"></circle>
        </svg>
      }
      @case ('art') {
        <img
          class="work-card-icon work-card-icon--image"
          [src]="card.imageSrc"
          [alt]="card.imageAlt ?? ''"
          aria-hidden="true"
        >
      }
    }

    <div class="work-card-copy">
      <h3>{{ card.title }}</h3>
      <p>{{ card.description }}</p>
      <ul [attr.aria-label]="card.title + ' services'">
        @for (service of card.services; track service) {
          <li>{{ service }}</li>
        }
      </ul>
    </div>
  </div>
</article>
